# SonarQube properties for autoservice project
sonar.projectKey=autoservice
sonar.projectName=autoservice
sonar.projectVersion=1.0
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Alinhado ao jacoco-maven-plugin (excludes): sem isso o Sonar conta presentation/infrastructure como 0% coberto.
sonar.coverage.exclusions=**/dto/**,**/*Config*,**/*Application*,**/infrastructure/**,**/presentation/**
