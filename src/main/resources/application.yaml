server:
  port: 8088
spring:
  application:
    name: autoservice
  config:
    import: optional:file:${user.dir}/local.variable.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoservice}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
autoservice:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8088}
  jwt:
    secret: ${AUTOSERVICE_JWT_SECRET:}
    issuer: ${AUTOSERVICE_JWT_ISSUER:autoservice-auth}
  mail:
    from: ${MAIL_FROM:orcamentos@autoservice.local}
  notificacao:
    webhook-url: ${AUTOSERVICE_NOTIFICACAO_WEBHOOK_URL:}
    simulada:
      habilitada: ${AUTOSERVICE_NOTIFICACAO_SIMULADA_HABILITADA:true}
  metrics:
    publish-interval-ms: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false
  statsd:
    metrics:
      export:
        enabled: ${DD_METRICS_EXPORT:true}
        host: ${DD_AGENT_HOST:localhost}
        port: 8125
        flavor: datadog
  metrics:
    tags:
      env: ${DD_ENV:local}
      service: ${DD_SERVICE:autoservice}
