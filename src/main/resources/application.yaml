server:
  port: 8080
spring:
  config:
    import: optional:file:${user.dir}/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoservice}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:localhost}  
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
autoservice:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${AUTOSERVICE_JWT_SECRET:}
  mail:
    from: ${MAIL_FROM:orcamentos@autoservice.local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

#minikube
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoservice-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoservice
  template:
    metadata:
      labels:
        app: autoservice
    spec:
      containers:
        - name: autoservice-api
          image: autoservice-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: autoservice-service
spec:
  type: NodePort
  selector:
    app: autoservice
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080