server:
  port: 8088
spring:
  application:
    name: autoservice
  config:
    import: optional:file:${user.dir}/local.variable.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoservice}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
autoservice:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8088}
  jwt:
    secret: ${AUTOSERVICE_JWT_SECRET:}
  mail:
    from: ${MAIL_FROM:orcamentos@autoservice.local}
  notificacao:
    webhook-url: ${AUTOSERVICE_NOTIFICACAO_WEBHOOK_URL:}
    simulada:
      habilitada: ${AUTOSERVICE_NOTIFICACAO_SIMULADA_HABILITADA:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}

management.metrics.export.datadog:
  enabled: ${DATADOG_ENABLED:false}
  api-key: ${DATADOG_API_KEY:}
  host: ${DD_AGENT_HOST:localhost}
  step: 30s

logging:
  level:
    root: INFO
  structured:
    format: json
