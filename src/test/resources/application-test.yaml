spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autoservice
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  mail:
    host: 127.0.0.1
    port: 3025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  main:
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: never

autoservice:
  app:
    base-url: http://localhost:0
  jwt:
    # Somente testes locais — nunca reutilizar em homolog/prod/Lambda
    secret: "test-only-jwt-secret-min-32-chars-xx"
  metrics:
    publish-interval-ms: 3600000

management:
  statsd:
    metrics:
      export:
        enabled: false
