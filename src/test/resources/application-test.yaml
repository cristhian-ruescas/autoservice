spring:
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  mail:
    host: 127.0.0.1
    port: 3025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  main:
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: never

