apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autoservice-postgres-pvc
  namespace: autoservice
  labels:
    app.kubernetes.io/name: autoservice-postgres
    app.kubernetes.io/part-of: autoservice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: autoservice-postgres
  namespace: autoservice
  labels:
    app.kubernetes.io/name: autoservice-postgres
    app.kubernetes.io/part-of: autoservice
spec:
  serviceName: autoservice-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoservice-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoservice-postgres
        app.kubernetes.io/part-of: autoservice
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: autoservice-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: autoservice-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: autoservice-postgres
  namespace: autoservice
  labels:
    app.kubernetes.io/name: autoservice-postgres
    app.kubernetes.io/part-of: autoservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autoservice-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
