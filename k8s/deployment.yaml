apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoservice-app
  namespace: autoservice
  labels:
    app.kubernetes.io/name: autoservice
    app.kubernetes.io/part-of: autoservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: autoservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoservice
        app.kubernetes.io/part-of: autoservice
    spec:
      containers:
        - name: autoservice
          image: autoservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: autoservice-config
            - secretRef:
                name: autoservice-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
