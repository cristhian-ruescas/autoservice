apiVersion: v1
kind: ConfigMap
metadata:
  name: autoservice-app-config
  namespace: autoservice
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://REPLACE_RDS_ENDPOINT:5432/postgres
  SPRING_DATASOURCE_USERNAME: postgres
  APP_BASE_URL: https://REPLACE_API_GATEWAY_URL
  MAIL_HOST: smtp.example.com
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
  MAIL_FROM: orcamentos@autoservice.local
  DD_ENV: homolog
  DD_SERVICE: autoservice
  DD_VERSION: "1.0.0"
  DD_LOGS_INJECTION: "true"
  DD_TRACE_SAMPLE_RATE: "1"
  DD_AGENT_HOST: datadog-agent.datadog.svc.cluster.local
  DD_TRACE_AGENT_PORT: "8126"
