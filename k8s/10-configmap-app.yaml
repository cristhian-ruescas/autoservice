apiVersion: v1
kind: ConfigMap
metadata:
  name: autoservice-app-config
  namespace: autoservice
data:
  # JDBC apontando para o banco gerenciado (repo autoservice-infra-db / Neon).
  # Substitua host/db conforme outputs do Terraform do repositório de DB.
  SPRING_DATASOURCE_URL: jdbc:postgresql://CHANGE_ME_MANAGED_DB_HOST:5432/autoservice?sslmode=require
  SPRING_DATASOURCE_USERNAME: autoservice
  APP_BASE_URL: http://autoservice-app:8088
  MAIL_HOST: smtp.example.com
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
  MAIL_FROM: orcamentos@autoservice.local
