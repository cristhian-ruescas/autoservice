name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: autoservice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── BUILD & TEST ───────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: autoservice
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Validate Kubernetes manifests (kustomize render)
        run: |
          set -euo pipefail
          for env in homolog prod; do
            kubectl kustomize "k8s/overlays/${env}" > "/tmp/k8s-rendered-${env}.yaml"
            test -s "/tmp/k8s-rendered-${env}.yaml"
          done

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autoservice
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          AUTOSERVICE_JWT_SECRET: ci-test-secret-do-not-use-in-production
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_USERNAME: test@autoservice.local
          MAIL_PASSWORD: test
          APP_BASE_URL: http://localhost:8088
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ─── DOCKER BUILD & PUSH ────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── DEPLOY APLICAÇÃO (K8s) — self-hosted Windows usa PowerShell ─
  deploy-app:
    name: Deploy Application (K8s)
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check kubectl
        run: kubectl version --client

      - name: Verify required deploy secrets
        env:
          AUTOSERVICE_JWT_SECRET: ${{ secrets.AUTOSERVICE_JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOSERVICE_JWT_SECRET)) { throw "AUTOSERVICE_JWT_SECRET secret is empty" }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_USERNAME)) { throw "MAIL_USERNAME secret is empty" }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_PASSWORD)) { throw "MAIL_PASSWORD secret is empty" }
          if ([string]::IsNullOrWhiteSpace($env:SPRING_DATASOURCE_URL)) { throw "SPRING_DATASOURCE_URL secret is empty" }
          if ([string]::IsNullOrWhiteSpace($env:SPRING_DATASOURCE_USERNAME)) { throw "SPRING_DATASOURCE_USERNAME secret is empty" }
          if ([string]::IsNullOrWhiteSpace($env:SPRING_DATASOURCE_PASSWORD)) { throw "SPRING_DATASOURCE_PASSWORD secret is empty" }

      - name: Configure kubectl
        run: |
          # Self-hosted: usa o kubeconfig local do k3d (nao sobrescreve com secret)
          $configPath = Join-Path $HOME ".kube\config"
          if (-not (Test-Path $configPath)) {
            throw "Kubeconfig local nao encontrado em $configPath. Rode: k3d cluster create autoservice-local --wait --agents 1"
          }
          # k3d no Windows as vezes grava host.docker.internal; no host precisa ser 127.0.0.1
          $cfg = Get-Content $configPath -Raw
          if ($cfg -match 'host\.docker\.internal') {
            ($cfg -replace 'https://host\.docker\.internal:','https://127.0.0.1:') | Set-Content $configPath -NoNewline
          }
          $env:KUBECONFIG = $configPath
          kubectl config current-context
          if ($LASTEXITCODE -ne 0) { throw "kubectl context invalido" }
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) { throw "cluster inacessivel. Verifique Docker Desktop e: k3d cluster list" }

      - name: Create/update GHCR pull secret
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          kubectl create secret docker-registry ghcr-pull-secret `
            --namespace=autoservice `
            --docker-server=ghcr.io `
            --docker-username="$env:GHCR_USER" `
            --docker-password="$env:GHCR_TOKEN" `
            --save-config --dry-run=client -o yaml | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { throw "ghcr pull secret apply failed" }

      - name: Create/update app secret
        env:
          AUTOSERVICE_JWT_SECRET: ${{ secrets.AUTOSERVICE_JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          kubectl create secret generic autoservice-app-secret `
            --namespace=autoservice `
            --from-literal=AUTOSERVICE_JWT_SECRET="$env:AUTOSERVICE_JWT_SECRET" `
            --from-literal=MAIL_USERNAME="$env:MAIL_USERNAME" `
            --from-literal=MAIL_PASSWORD="$env:MAIL_PASSWORD" `
            --from-literal=SPRING_DATASOURCE_URL="$env:SPRING_DATASOURCE_URL" `
            --from-literal=SPRING_DATASOURCE_USERNAME="$env:SPRING_DATASOURCE_USERNAME" `
            --from-literal=SPRING_DATASOURCE_PASSWORD="$env:SPRING_DATASOURCE_PASSWORD" `
            --save-config --dry-run=client -o yaml | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { throw "app secret apply failed" }

      - name: Apply namespace and app manifests
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          kubectl apply -k k8s/overlays/prod
          if ($LASTEXITCODE -ne 0) { throw "kustomize apply (overlays/prod) failed" }

      - name: Update image tag
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          $imageName = "${{ env.IMAGE_NAME }}".ToLower()
          $image = "${{ env.REGISTRY }}/${imageName}:sha-${{ github.sha }}"
          kubectl set image deployment/autoservice-app autoservice-app=$image -n autoservice
          if ($LASTEXITCODE -ne 0) { throw "set image failed" }

      - name: Wait for app rollout
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          # startupProbe permite ate ~300s; timeout do rollout precisa ser maior
          kubectl rollout status deployment/autoservice-app -n autoservice --timeout=360s
          if ($LASTEXITCODE -ne 0) { throw "app rollout failed" }

      - name: Validate pods and HPA
        run: |
          $env:KUBECONFIG = Join-Path $HOME ".kube\config"
          kubectl -n autoservice get pods,svc,hpa
