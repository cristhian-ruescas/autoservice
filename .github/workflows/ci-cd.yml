name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: autoservice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── BUILD & TEST ───────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: autoservice
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Validate Kubernetes manifests (kustomize render)
        run: |
          set -euo pipefail
          kubectl kustomize k8s > /tmp/k8s-rendered.yaml
          test -s /tmp/k8s-rendered.yaml

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autoservice
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          AUTOSERVICE_JWT_SECRET: ci-test-secret-do-not-use-in-production
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_USERNAME: test@autoservice.local
          MAIL_PASSWORD: test
          APP_BASE_URL: http://localhost:8088
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ─── DOCKER BUILD & PUSH ────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── DEPLOY BANCO (K8s secret + manifests) ──────────────────────
  deploy-db:
    name: Deploy Database (K8s)
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify required deploy secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KUBECONFIG_B64}"
          test -n "${POSTGRES_PASSWORD}"

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl cluster-info

      - name: Apply namespace & postgres manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/20-configmap-postgres.yaml
          kubectl apply -f k8s/22-pvc-postgres.yaml
          kubectl apply -f k8s/23-deployment-postgres.yaml
          kubectl apply -f k8s/24-service-postgres.yaml

      - name: Create/update postgres secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl create secret generic autoservice-postgres-secret \
            --namespace=autoservice \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for postgres rollout
        run: kubectl rollout status deployment/autoservice-postgres -n autoservice --timeout=120s

  # ─── DEPLOY APLICAÇÃO (K8s) ─────────────────────────────────────
  # Roda no self-hosted runner (seu PC) para alcançar o k3d em 127.0.0.1
  deploy-app:
    name: Deploy Application (K8s)
    runs-on: self-hosted
    needs: [ docker, deploy-db ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify required deploy secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          AUTOSERVICE_JWT_SECRET: ${{ secrets.AUTOSERVICE_JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KUBECONFIG_B64}"
          test -n "${AUTOSERVICE_JWT_SECRET}"
          test -n "${MAIL_USERNAME}"
          test -n "${MAIL_PASSWORD}"

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl cluster-info

      - name: Create/update GHCR pull secret
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=autoservice \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USER}" \
            --docker-password="${GHCR_TOKEN}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update app secret
        env:
          AUTOSERVICE_JWT_SECRET: ${{ secrets.AUTOSERVICE_JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl create secret generic autoservice-app-secret \
            --namespace=autoservice \
            --from-literal=AUTOSERVICE_JWT_SECRET="${AUTOSERVICE_JWT_SECRET}" \
            --from-literal=MAIL_USERNAME="${MAIL_USERNAME}" \
            --from-literal=MAIL_PASSWORD="${MAIL_PASSWORD}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply app manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/10-configmap-app.yaml
          kubectl apply -f k8s/30-deployment-app.yaml
          kubectl apply -f k8s/31-service-app.yaml
          kubectl apply -f k8s/32-hpa-app.yaml
          kubectl patch deployment autoservice-app -n autoservice \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}}}}'

      - name: Update image tag
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):sha-${{ github.sha }}"
          kubectl set image deployment/autoservice-app \
            autoservice-app="${IMAGE}" \
            -n autoservice

      - name: Wait for app rollout
        run: kubectl rollout status deployment/autoservice-app -n autoservice --timeout=180s

      - name: Validate pods and HPA
        run: kubectl -n autoservice get pods,svc,hpa
